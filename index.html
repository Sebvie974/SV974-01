<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Catalogue Astro</title>
    <link rel="manifest" href="manifest.json">
    <style>
        :root {
            --bg-color: #0b101a;
            --card-bg: rgba(22, 28, 39, 0.9);
            --accent: #3498db;
            --text: #ecf0f1;
            --highlight: #f1c40f;
            --success: #2ecc71;
            --warning: #e67e22;
            --project: #9b59b6;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg-color);
            background-size: cover; background-position: center; background-attachment: fixed;
            color: var(--text); margin: 0; padding: 20px; min-height: 100vh;
        }

        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.4); z-index: -1; }

        header { text-align: center; margin-bottom: 20px; }
        h1 { color: var(--accent); margin-bottom: 15px; text-shadow: 0 2px 10px rgba(0,0,0,0.5); }
        
        .moon-widget {
            background: rgba(0, 0, 0, 0.6); border: 1px solid var(--highlight);
            border-radius: 15px; padding: 15px; max-width: 300px; margin: 0 auto 25px;
            display: flex; align-items: center; justify-content: center; gap: 20px;
        }
        .moon-icon { font-size: 2.5rem; }
        .moon-percent { font-weight: bold; color: var(--highlight); display: block; }

        .admin-panel {
            background: rgba(31, 39, 53, 0.95); max-width: 1100px; margin: 0 auto 30px; padding: 20px;
            border-radius: 12px; border: 1px solid #34495e; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .form-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 12px; margin-bottom: 20px;
        }

        .form-group { display: flex; flex-direction: column; gap: 5px; }
        .full-width { grid-column: 1 / -1; }
        label { font-size: 0.75rem; color: #95a5a6; text-transform: uppercase; }

        input, select, textarea, button { padding: 10px; border-radius: 6px; border: 1px solid #333; background: #0b101a; color: white; font-family: inherit; }
        input[type="checkbox"] { width: 18px; height: 18px; cursor: pointer; accent-color: var(--highlight); }
        
        .btn-add { background: var(--accent); border: none; font-weight: bold; cursor: pointer; height: 100%; transition: 0.2s; padding: 12px; }
        .btn-add:hover { filter: brightness(1.2); }
        .btn-update { background: var(--success) !important; display: none; }

        .file-actions { border-top: 1px solid #34495e; padding-top: 15px; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
        .btn-tool { border: none; font-weight: bold; cursor: pointer; padding: 10px 15px; transition: 0.2s; border-radius: 6px; color: white; text-decoration: none; display: inline-flex; align-items: center; }
        .btn-tool:hover { filter: brightness(1.2); }

        .controls { text-align: center; margin-bottom: 25px; }
        .filter-btn { margin: 5px; cursor: pointer; padding: 10px 20px; border-radius: 20px; border: 1px solid var(--accent); background: transparent; color: var(--accent); font-weight: bold; }
        .filter-btn.active { background: var(--accent); color: white; }

        .catalog { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; max-width: 1200px; margin: 0 auto; }

        .card { background: var(--card-bg); border-radius: 10px; padding: 20px; border-top: 4px solid #333; position: relative; backdrop-filter: blur(5px); }
        .card.is-visible { border-top-color: var(--success); }

        .order-badge {
            position: absolute; left: -10px; top: -10px;
            background: var(--highlight); color: #000;
            width: 30px; height: 30px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-weight: bold; border: 2px solid var(--bg-color); z-index: 5;
        }

        .status-badge { font-size: 0.75rem; font-weight: bold; padding: 5px 12px; border-radius: 12px; margin-bottom: 12px; display: inline-block; border: 1px solid transparent; }
        .status-visible { background: rgba(46, 204, 113, 0.15); color: #2ecc71; border-color: rgba(46, 204, 113, 0.3); }
        .status-hidden { background: rgba(255, 255, 255, 0.05); color: #7f8c8d; border-color: rgba(255, 255, 255, 0.1); }

        .ref { color: var(--highlight); font-family: monospace; font-size: 1.4rem; font-weight: bold; }
        .obj-name { font-size: 1.2rem; margin: 5px 0 2px 0; display: block; }
        .obj-type { font-size: 0.85rem; color: var(--accent); font-style: italic; margin-bottom: 10px; display: block; }
        .obj-hem-tag { font-size: 0.75rem; color: #95a5a6; display: block; margin-top: 8px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 5px; }
        
        .notes-display { background: rgba(0,0,0,0.3); padding: 10px; border-radius: 5px; font-size: 0.85rem; margin-top: 12px; color: #bdc3c7; border-left: 3px solid var(--accent); white-space: pre-wrap; }
        
        .card-actions { position: absolute; top: 15px; right: 10px; display: flex; gap: 12px; }
        .btn-icon { cursor: pointer; background: none; border: none; font-size: 1.3rem; padding: 0; text-decoration: none; }

        .project-badges-container { margin-top: 15px; display: flex; flex-wrap: wrap; gap: 8px; }
        .project-badge { background: rgba(155, 89, 182, 0.2); color: #d2b4de; border: 1px solid var(--project); padding: 5px 10px; border-radius: 15px; font-size: 0.8rem; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .project-badge:hover { background: var(--project); color: white; }

        .modal { display: none; position: fixed; z-index: 100; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); backdrop-filter: blur(5px); }
        .modal-content { background: #161c27; margin: 5% auto; padding: 25px; border: 1px solid var(--project); width: 90%; max-width: 800px; border-radius: 12px; max-height: 85vh; overflow-y: auto; scroll-behavior: smooth; }
        .close-modal { color: #aaa; float: right; font-size: 28px; font-weight: bold; cursor: pointer; line-height: 1; }
        .close-modal:hover { color: white; }
        
        .session-item { background: rgba(0,0,0,0.4); border-left: 4px solid var(--project); padding: 15px; margin-bottom: 10px; border-radius: 4px; display: flex; justify-content: space-between; align-items: center; }
        .session-details { font-size: 0.85rem; color: #bdc3c7; line-height: 1.5; }
        .session-title { color: var(--highlight); font-weight: bold; font-size: 1rem; display: block; margin-bottom: 5px; }
        .session-btn-group { display: flex; gap: 15px; }
        .session-action-btn { background: none; border: none; cursor: pointer; font-size: 1.2rem; padding: 0; transition: transform 0.2s; }
        .session-action-btn:hover { transform: scale(1.2); }

        .mosaic-container { background: rgba(241, 196, 15, 0.1); border-left: 3px solid var(--highlight); padding: 10px 15px; border-radius: 4px; display: none; margin-top: 10px; }

        /* Styles pour le récapitulatif des filtres */
        .filter-summary { background: rgba(52, 152, 219, 0.1); border-left: 4px solid var(--accent); padding: 12px 15px; border-radius: 6px; margin-bottom: 15px; display: flex; flex-wrap: wrap; gap: 10px; }
        .filter-summary-item { background: rgba(0,0,0,0.4); padding: 6px 12px; border-radius: 6px; font-size: 0.85rem; border: 1px solid rgba(255,255,255,0.08); }
        .filter-summary-item strong { color: var(--highlight); }
    </style>
</head>
<body>

<div class="overlay"></div>

<header>
    <h1>🔭 Astro Suivi</h1>
    <div id="moon-widget" class="moon-widget">
        <div id="moon-icon" class="moon-icon">🌑</div>
        <div class="moon-info">
            <span id="moon-percent" class="moon-percent">Calcul...</span>
            <span id="moon-advice" style="font-size: 0.75rem; color: #ccc;">...</span>
        </div>
    </div>
</header>

<section class="admin-panel">
    <input type="hidden" id="editId">
    <div class="form-grid">
        <div class="form-group"><label>Référence</label><input type="text" id="objRef" placeholder="M42, IC2944..."></div>
        <div class="form-group"><label>Nom</label><input type="text" id="objName"></div>
        <div class="form-group">
            <label>Type</label>
            <select id="objType">
                <option value="Nébuleuse">Nébuleuse</option>
                <option value="Galaxie">Galaxie</option>
                <option value="Amas Ouvert">Amas Ouvert</option>
                <option value="Amas Globulaire">Amas Globulaire</option>
                <option value="Néb. Planétaire">Néb. Planétaire</option>
                <option value="Autre">Autre</option>
            </select>
        </div>
        <div class="form-group"><label>Début</label><select id="monthStart"></select></div>
        <div class="form-group"><label>Fin</label><select id="monthEnd"></select></div>
        <div class="form-group">
            <label>Hémisphère</label>
            <select id="objHem">
                <option value="Nord">Nord</option>
                <option value="Sud">Sud</option>
                <option value="Nord & Sud">Nord & Sud</option>
            </select>
        </div>
        <div class="form-group">
            <label>Ordre Photo</label>
            <input type="number" id="objOrder" placeholder="N°" min="1">
        </div>
        <div class="form-group full-width">
            <label>Notes globales (Aperçu rapide)</label>
            <textarea id="objNotes" placeholder="Ex: Cible facile, éviter pleine lune..."></textarea>
        </div>
        <div class="full-width" style="display: flex; gap: 10px;">
            <button id="addBtn" class="btn-add" style="flex:2" onclick="addCustomObject()">AJOUTER CIBLE</button>
            <button id="updateBtn" class="btn-add btn-update" style="flex:2" onclick="updateObject()">ENREGISTRER MODIFS</button>
        </div>
    </div>

    <div class="file-actions">
        <button class="btn-tool" style="background:#e67e22" onclick="document.getElementById('bgInput').click()">🖼️ Fond</button>
        <a href="URL_DE_TA_VIDEO_ICI" target="_blank" class="btn-tool" style="background:#2980b9;">🎥 Tutoriel</a>
        <button class="btn-tool" style="background:#27ae60" onclick="exportJSON()">💾 Exporter</button>
        <button class="btn-tool" style="background:#8e44ad" onclick="document.getElementById('fileInput').click()">📂 Importer</button>
        <input type="file" id="bgInput" style="display:none" accept="image/*" onchange="changeBackground(event)">
        <input type="file" id="fileInput" style="display:none" accept=".json" onchange="importJSON(event)">
    </div>
</section>

<div class="controls">
    <button onclick="setHemisphere('Nord')" id="btnNord" class="filter-btn">Nord</button>
    <button onclick="setHemisphere('Sud')" id="btnSud" class="filter-btn">Sud</button>
    <select id="sortType" onchange="render()" style="padding:10px; border-radius:20px; background:rgba(0,0,0,0.5); color:white; border:1px solid var(--accent);">
        <option value="order">Ordre de prise de vue (N°)</option>
        <option value="visibility">Priorité Visibilité</option>
        <option value="ref">Référence A-Z</option>
    </select>
</div>

<div class="catalog" id="catalog"></div>

<div id="sessionModal" class="modal">
    <div class="modal-content" id="modalContentDiv">
        <span class="close-modal" onclick="closeModal()">&times;</span>
        <h2 id="modalTitle" style="color: var(--project); margin-top:0;">Sessions d'Acquisition</h2>
        
        <div class="admin-panel" style="margin-bottom: 20px; padding: 15px; box-shadow:none;">
            <h3 style="margin-top:0; color:var(--accent); font-size:1rem;">Nouvelle Session</h3>
            <div class="form-grid">
                <div class="form-grid" style="grid-column: 1 / -1; gap: 12px;">
                    <div class="form-group"><label>Projet / Compo</label><input type="text" id="sesProject" placeholder="Ex: SHO, Mosaïque Orion..."></div>
                    <div class="form-group"><label>Date</label><input type="date" id="sesDate"></div>
                    <div class="form-group"><label>Nb de Poses</label><input type="number" id="sesCount" placeholder="Ex: 60"></div>
                    <div class="form-group"><label>Temps Unitaire (s)</label><input type="number" id="sesTime" placeholder="Ex: 300"></div>
                    <div class="form-group"><label>Filtre</label><input type="text" id="sesFilter" placeholder="Ex: Ha, OIII, RGB..."></div>
                    <div class="form-group"><label>Caméra</label><input type="text" id="sesCam" placeholder="Ex: Ares-C Pro"></div>
                    <div class="form-group"><label>Lunette / Tube</label><input type="text" id="sesScope" placeholder="Ex: TS 61 EDPH II"></div>
                </div>
                
                <div class="form-group full-width" style="flex-direction: row; align-items: center; gap: 10px; margin-top: 5px;">
                    <input type="checkbox" id="sesMosaic" onchange="toggleMosaic()">
                    <label for="sesMosaic" style="color: var(--highlight); cursor: pointer; margin: 0; font-size: 0.85rem;">Cette session est une tuile de mosaïque</label>
                </div>
                
                <div id="mosaicFields" class="form-grid full-width mosaic-container">
                    <div class="form-group"><label style="color:#f1c40f;">Panneau N°</label><input type="number" id="sesPanelNum" placeholder="Ex: 1" min="1"></div>
                    <div class="form-group"><label style="color:#f1c40f;">Total de Panneaux</label><input type="number" id="sesPanelTotal" placeholder="Ex: 6" min="1"></div>
                </div>

                <div class="full-width">
                    <button id="btnSubmitSession" class="btn-add" style="width:100%; background:var(--project); margin-top: 10px;" onclick="saveSession()">VALIDER LA SESSION</button>
                </div>
            </div>
        </div>

        <div id="sessionListFilter" style="margin-bottom: 10px;"></div>
        <div id="sessionFilterSummary"></div>
        <div id="sessionList"></div>
    </div>
</div>

<script>
    const monthNames = ["Janvier", "Février", "Mars", "Avril", "Mai", "Juin", "Juillet", "Août", "Septembre", "Octobre", "Novembre", "Décembre"];
    
    [document.getElementById('monthStart'), document.getElementById('monthEnd')].forEach(s => {
        monthNames.forEach((m, i) => { s.add(new Option(m, i)); });
    });

    let myObjects = JSON.parse(localStorage.getItem('astroData_v3')) || [];
    let currentHemFilter = "Sud";
    let currentTargetId = null;
    let currentProjectFilter = null;
    let currentEditSessionId = null;
    const currentMonthIndex = new Date().getMonth();

    document.getElementById('sesDate').valueAsDate = new Date();

    function updateMoon() {
        const lp = 2551443; const now = new Date(); const new_moon = new Date(1970, 0, 7, 20, 35, 0);
        const phase = ((now.getTime() - new_moon.getTime()) / 1000) % lp;
        const age = phase / (24 * 3600);
        let icon = "🌑", percent = Math.round((1 - Math.abs((age - 14.76) / 14.76)) * 100);
        if (age < 1.84) icon="🌑"; else if (age < 5.53) icon="🌒"; else if (age < 9.22) icon="🌓"; else if (age < 12.91) icon="🌔"; else if (age < 16.6) icon="🌕"; else if (age < 20.29) icon="🌖"; else if (age < 23.98) icon="🌗"; else icon="🌘";
        document.getElementById('moon-icon').innerText = icon; document.getElementById('moon-percent').innerText = `Lune : ${percent}%`; document.getElementById('moon-advice').innerText = percent > 50 ? "Lune gênante." : "Ciel profond OK !";
    }
    updateMoon();

    const savedBG = localStorage.getItem('astro_bg_stable');
    if(savedBG) document.body.style.backgroundImage = `url(${savedBG})`;

    function addCustomObject() {
        const orderVal = document.getElementById('objOrder').value;
        myObjects.push({
            id: Date.now(),
            ref: document.getElementById('objRef').value.toUpperCase() || "N/A",
            name: document.getElementById('objName').value || "Sans nom",
            type: document.getElementById('objType').value,
            notes: document.getElementById('objNotes').value,
            order: orderVal !== "" ? parseInt(orderVal) : 999,
            startIdx: parseInt(document.getElementById('monthStart').value),
            endIdx: parseInt(document.getElementById('monthEnd').value),
            hem: document.getElementById('objHem').value,
            sessions: []
        });
        saveAndRender(); clearForm();
    }

    function editObject(id) {
        const o = myObjects.find(obj => obj.id === id);
        document.getElementById('editId').value = o.id;
        document.getElementById('objRef').value = o.ref;
        document.getElementById('objName').value = o.name;
        document.getElementById('objType').value = o.type;
        document.getElementById('objNotes').value = o.notes || "";
        document.getElementById('objOrder').value = o.order === 999 ? "" : o.order;
        document.getElementById('monthStart').value = o.startIdx;
        document.getElementById('monthEnd').value = o.endIdx;
        document.getElementById('objHem').value = o.hem;
        document.getElementById('addBtn').style.display = 'none';
        document.getElementById('updateBtn').style.display = 'block';
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function updateObject() {
        const id = parseInt(document.getElementById('editId').value);
        const idx = myObjects.findIndex(o => o.id === id);
        const orderVal = document.getElementById('objOrder').value;
        myObjects[idx] = {...myObjects[idx], 
            ref: document.getElementById('objRef').value.toUpperCase(), name: document.getElementById('objName').value,
            type: document.getElementById('objType').value, notes: document.getElementById('objNotes').value,
            order: orderVal !== "" ? parseInt(orderVal) : 999, startIdx: parseInt(document.getElementById('monthStart').value),
            endIdx: parseInt(document.getElementById('monthEnd').value), hem: document.getElementById('objHem').value
        };
        saveAndRender(); clearForm();
    }

    function toggleMosaic() {
        const isChecked = document.getElementById('sesMosaic').checked;
        document.getElementById('mosaicFields').style.display = isChecked ? 'grid' : 'none';
    }

    function openSessions(id, projectName = null) {
        currentTargetId = id;
        currentProjectFilter = projectName;
        const obj = myObjects.find(o => o.id === id);
        document.getElementById('modalTitle').innerText = `Acquisitions : ${obj.ref} - ${obj.name}`;
        
        if(projectName) document.getElementById('sesProject').value = projectName;
        
        clearSessionForm();
        renderSessionList();
        document.getElementById('sessionModal').style.display = "block";
    }

    function closeModal() {
        document.getElementById('sessionModal').style.display = "none";
        clearSessionForm();
        render(); 
    }

    function clearSessionForm() {
        document.getElementById('sesCount').value = "";
        document.getElementById('sesTime').value = "";
        document.getElementById('sesMosaic').checked = false;
        document.getElementById('sesPanelNum').value = "";
        document.getElementById('sesPanelTotal').value = "";
        toggleMosaic();
        currentEditSessionId = null;
        document.getElementById('btnSubmitSession').innerText = "VALIDER LA SESSION";
        document.getElementById('btnSubmitSession').style.background = "var(--project)";
    }

    function saveSession() {
        const obj = myObjects.find(o => o.id === currentTargetId);
        if(!obj.sessions) obj.sessions = [];
        
        const count = parseInt(document.getElementById('sesCount').value) || 0;
        const time = parseInt(document.getElementById('sesTime').value) || 0;
        const isMosaic = document.getElementById('sesMosaic').checked;
        
        const sessionData = {
            project: document.getElementById('sesProject').value || 'Défaut',
            date: document.getElementById('sesDate').value,
            count: count, time: time,
            filter: document.getElementById('sesFilter').value.trim() || '-',
            cam: document.getElementById('sesCam').value || '-',
            scope: document.getElementById('sesScope').value || '-',
            isMosaic: isMosaic,
            panelNum: isMosaic ? document.getElementById('sesPanelNum').value : null,
            panelTotal: isMosaic ? document.getElementById('sesPanelTotal').value : null
        };

        if (currentEditSessionId) {
            const sIndex = obj.sessions.findIndex(s => s.id === currentEditSessionId);
            if (sIndex > -1) obj.sessions[sIndex] = { ...obj.sessions[sIndex], ...sessionData };
        } else {
            obj.sessions.push({ id: Date.now(), ...sessionData });
        }
        
        saveAndRender();
        renderSessionList();
        clearSessionForm();
    }

    function editSession(sessionId) {
        const obj = myObjects.find(o => o.id === currentTargetId);
        const s = obj.sessions.find(x => x.id === sessionId);
        if (!s) return;

        currentEditSessionId = sessionId;
        document.getElementById('sesProject').value = s.project || '';
        document.getElementById('sesDate').value = s.date || '';
        document.getElementById('sesCount').value = s.count || '';
        document.getElementById('sesTime').value = s.time || '';
        document.getElementById('sesFilter').value = s.filter || '';
        document.getElementById('sesCam').value = s.cam || '';
        document.getElementById('sesScope').value = s.scope || '';
        document.getElementById('sesMosaic').checked = !!s.isMosaic;
        document.getElementById('sesPanelNum').value = s.panelNum || '';
        document.getElementById('sesPanelTotal').value = s.panelTotal || '';
        toggleMosaic();

        document.getElementById('btnSubmitSession').innerText = "METTRE À JOUR LA SESSION";
        document.getElementById('btnSubmitSession').style.background = "var(--success)";
        document.getElementById('modalContentDiv').scrollTo({ top: 0, behavior: 'smooth' });
    }

    function deleteSession(sessionId) {
        if(confirm("Supprimer cette session ?")) {
            const obj = myObjects.find(o => o.id === currentTargetId);
            obj.sessions = obj.sessions.filter(s => s.id !== sessionId);
            saveAndRender();
            renderSessionList();
            if(currentEditSessionId === sessionId) clearSessionForm();
        }
    }

    function renderSessionList() {
        const obj = myObjects.find(o => o.id === currentTargetId);
        const listDiv = document.getElementById('sessionList');
        const filterDiv = document.getElementById('sessionListFilter');
        const summaryDiv = document.getElementById('sessionFilterSummary');
        
        listDiv.innerHTML = ''; filterDiv.innerHTML = ''; summaryDiv.innerHTML = '';

        if(!obj.sessions || obj.sessions.length === 0) {
            listDiv.innerHTML = '<p style="color:#7f8c8d; text-align:center;">Aucune session enregistrée pour cette cible.</p>';
            return;
        }

        let displaySessions = obj.sessions;
        
        if(currentProjectFilter) {
            filterDiv.innerHTML = `<span class="project-badge" onclick="openSessions(${obj.id}, null)">❌ Filtre actif : ${currentProjectFilter} (Cliquez pour annuler)</span>`;
            displaySessions = obj.sessions.filter(s => s.project === currentProjectFilter);
        }

        /* LOGIQUE DE CALCUL DU TEMPS PAR FILTRE */
        if(displaySessions.length > 0) {
            const filterTotals = {};
            displaySessions.forEach(s => {
                const f = s.filter && s.filter.trim() !== '' ? s.filter.trim() : '-';
                const totalSec = s.count * s.time;
                filterTotals[f] = (filterTotals[f] || 0) + totalSec;
            });

            const summaryContainer = document.createElement('div');
            summaryContainer.className = 'filter-summary';
            summaryContainer.innerHTML = '<h4 style="margin:0 0 8px 0; width:100%; font-size:0.8rem; color:#95a5a6; text-transform:uppercase; letter-spacing:0.5px;">Temps total par filtre :</h4>';

            Object.keys(filterTotals).forEach(f => {
                const totalSec = filterTotals[f];
                const hours = Math.floor(totalSec / 3600);
                const mins = Math.floor((totalSec % 3600) / 60);
                const timeStr = hours > 0 ? `${hours}h ${mins}m` : `${mins} min`;

                const summaryItem = document.createElement('span');
                summaryItem.className = 'filter-summary-item';
                summaryItem.innerHTML = `Filtre <b>${f}</b> : <strong>${timeStr}</strong>`;
                summaryContainer.appendChild(summaryItem);
            });
            summaryDiv.appendChild(summaryContainer);
        }

        displaySessions.sort((a,b) => new Date(b.date) - new Date(a.date));

        displaySessions.forEach(s => {
            const totalSec = s.count * s.time;
            const hours = Math.floor(totalSec / 3600);
            const mins = Math.floor((totalSec % 3600) / 60);
            const timeStr = hours > 0 ? `${hours}h ${mins}m` : `${mins} min`;
            
            const mosaicLabel = s.isMosaic ? `<span style="color:var(--highlight); font-size:0.8rem; margin-left:8px; border:1px solid var(--highlight); padding:2px 6px; border-radius:10px;">Mosaïque: Panneau ${s.panelNum}/${s.panelTotal}</span>` : '';

            const item = document.createElement('div');
            item.className = 'session-item';
            item.innerHTML = `
                <div>
                    <span class="session-title">[${s.project}] - ${s.date} ${mosaicLabel}</span>
                    <div class="session-details">
                        <b>Intégration:</b> ${s.count} poses x ${s.time}s (${timeStr})<br>
                        <b>Matériel:</b> ${s.scope} | ${s.cam} | Filtre: ${s.filter}
                    </div>
                </div>
                <div class="session-btn-group">
                    <button class="session-action-btn" style="color:var(--accent)" onclick="editSession(${s.id})" title="Modifier session">✏️</button>
                    <button class="session-action-btn" style="color:#e74c3c" onclick="deleteSession(${s.id})" title="Supprimer session">🗑</button>
                </div>
            `;
            listDiv.appendChild(item);
        });
    }

    function render() {
        const container = document.getElementById('catalog');
        const sortVal = document.getElementById('sortType').value;
        container.innerHTML = '';
        
        let data = myObjects.filter(o => o.hem === currentHemFilter || o.hem === "Nord & Sud");
        
        data.sort((a, b) => {
            if (sortVal === "order") return (a.order || 999) - (b.order || 999);
            if (sortVal === "visibility") {
                const vis = (o) => (o.startIdx <= o.endIdx ? (currentMonthIndex >= o.startIdx && currentMonthIndex <= o.endIdx) : (currentMonthIndex >= o.startIdx || currentMonthIndex <= o.endIdx));
                if (vis(a) !== vis(b)) return vis(b) ? 1 : -1;
                return (a.order || 999) - (b.order || 999);
            }
            return a.ref.localeCompare(b.ref);
        });

        data.forEach(o => {
            const vis = o.startIdx <= o.endIdx ? (currentMonthIndex >= o.startIdx && currentMonthIndex <= o.endIdx) : (currentMonthIndex >= o.startIdx || currentMonthIndex <= o.endIdx);
            const stellariumUrl = `https://stellarium-web.org/skysource/${o.ref.replace(/\s/g, '')}`;
            
            let projectBadgesHTML = '';
            if (o.sessions && o.sessions.length > 0) {
                const projects = [...new Set(o.sessions.map(s => s.project))];
                projects.forEach(p => {
                    let totalTimeSec = 0;
                    o.sessions.filter(s => s.project === p).forEach(s => totalTimeSec += (s.count * s.time));
                    let hours = (totalTimeSec / 3600).toFixed(1);
                    projectBadgesHTML += `<span class="project-badge" onclick="openSessions(${o.id}, '${p}')">📸 ${p} (${hours}h)</span>`;
                });
            }

            const card = document.createElement('div');
            card.className = `card ${vis ? 'is-visible' : ''}`;
            card.innerHTML = `
                ${o.order < 999 ? `<div class="order-badge">${o.order}</div>` : ''}
                <div class="card-actions">
                    <button class="btn-icon" style="color:var(--project)" onclick="openSessions(${o.id})" title="Gérer les Sessions">📸</button>
                    <a href="${stellariumUrl}" target="_blank" class="btn-icon" title="Éphémérides">📡</a>
                    <button class="btn-icon" style="color:var(--accent)" onclick="editObject(${o.id})" title="Modifier">✏️</button>
                    <button class="btn-icon" style="color:#e74c3c" onclick="deleteObject(${o.id})" title="Supprimer">🗑</button>
                </div>
                <div class="status-badge ${vis ? 'status-visible' : 'status-hidden'}">${vis ? '● Visible' : '○ Hors saison'}</div><br>
                <span class="ref">${o.ref}</span>
                <span class="obj-name">${o.name}</span>
                <span class="obj-type">${o.type}</span>
                <div style="font-size:0.75rem; color:#aaa;">${monthNames[o.startIdx]} — ${monthNames[o.endIdx]}</div>
                <span class="obj-hem-tag">🌍 ${o.hem}</span>
                
                ${projectBadgesHTML ? `<div class="project-badges-container">${projectBadgesHTML}</div>` : ''}
                ${o.notes ? `<div class="notes-display">${o.notes}</div>` : ''}
            `;
            container.appendChild(card);
        });
    }

    function clearForm() { 
        document.getElementById('editId').value = ""; document.getElementById('objRef').value = ""; 
        document.getElementById('objName').value = ""; document.getElementById('objNotes').value = "";
        document.getElementById('objOrder').value = "";
        document.getElementById('addBtn').style.display = 'block'; document.getElementById('updateBtn').style.display = 'none'; 
    }
    function saveAndRender() { localStorage.setItem('astroData_v3', JSON.stringify(myObjects)); render(); }
    function setHemisphere(h) { currentHemFilter = h; document.getElementById('btnNord').classList.toggle('active', h === 'Nord'); document.getElementById('btnSud').classList.toggle('active', h === 'Sud'); render(); }
    function deleteObject(id) { if(confirm("Supprimer cette cible et toutes ses sessions ?")) { myObjects = myObjects.filter(o => o.id !== id); saveAndRender(); } }
    function changeBackground(event) { const f = event.target.files[0]; const r = new FileReader(); r.onload = (e) => { document.body.style.backgroundImage = `url(${e.target.result})`; localStorage.setItem('astro_bg_stable', e.target.result); }; r.readAsDataURL(f); }
    function exportJSON() { const d = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(myObjects)); const a = document.createElement('a'); a.href = d; a.download = "astro_suivi_complet.json"; a.click(); }
    function importJSON(e) { const r = new FileReader(); r.onload = (e) => { try { myObjects = JSON.parse(e.target.result); saveAndRender(); } catch(err) { alert("Erreur JSON"); } }; r.readAsText(e.target.files[0]); }
    
    if ('serviceWorker' in navigator) { window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js')); }
    setHemisphere('Sud');
</script>
</body>
</html>
